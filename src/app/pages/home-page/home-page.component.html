<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Grayscale - Start Bootstrap Theme</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />

    </head>
    <body 
      id="page-top"
      style="
        background-image : url('assets/bootstrap/img/bg-masthead.jpg');
        background-size: cover;
        background-attachment: fixed;"
    >
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="#page-top">Resonance Xone</a>
                <button class="navbar-toggler navbar-toggler-right" 
                  type="button" 
                  aria-controls="navbarResponsive" 
                  aria-expanded="false" 
                  aria-label="Toggle navigation"
                  [attr.aria-expanded]="isMenuOpen"
                  (click)="toggleMenu()"
                >
                    Menu
                    <i class="fas fa-bars"></i>
                </button>
                <div class="collapse navbar-collapse" 
                  id="navbarResponsive"
                  [ngClass]="{'show' : isMenuOpen}"
                
                >
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item" (click)="toggleMenu()"><a class="nav-link" href="#about" >關於我們</a></li>
                        <li class="nav-item" (click)="toggleMenu()"><a class="nav-link" href="#projects" >本次派對</a></li>
                        <li class="nav-item" (click)="toggleMenu()"><a class="nav-link" href="#contact" >報名</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        
         <!-- About-->
        <section 
          id="about" 
          style="padding-top: 10%;"
        >
          <div class="container px-4 px-lg-5">
              <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-lg-12"><img class="img-fluid" src="assets/bootstrap/img/listen/normal/1.jpg" alt="..." /></div>
                <div class="col-lg-12"><img class="img-fluid" src="assets/bootstrap/img/listen/normal/2.jpg" alt="..." /></div>   
              </div>
          </div>
        </section>
        
        <!-- Projects-->
        <section  id="projects"
        >
            <div class="container px-4  px-lg-5">
                <!-- Featured Project Row-->
                <div class="row gx-0   align-items-center">
                    <div class="col-lg-12"><img class="img-fluid" src="assets/bootstrap/img/listen/normal/3.jpg" alt="..." /></div>
                    <div class="col-lg-12"><img class="img-fluid" src="assets/bootstrap/img/listen/normal/4.jpg" alt="..." /></div>  
                </div>
            </div>
        </section>

        <!-- Contact-->
        <section id="contact"  class="contact-section " 
        >
          <div class="container px-4 px-lg-5">
            <div class="row gx-0   align-items-center">
              <div class="col-lg-12"><img class="img-fluid" src="assets/bootstrap/img/listen/normal/5.jpg" alt="..." /></div>   
              <div class="col-lg-12">
                <a class="" 
                  href="https://forms.gle/ToHuHUJH2xMRkSQ28"
                  style="background-color: #f7af04;"
                >
                  <img class="img-fluid" src="assets/bootstrap/img/listen/normal/6.jpg" alt="..." />
                </a>
              </div>  
              <div class="col-lg-12"><img class="img-fluid" src="assets/bootstrap/img/listen/normal/7.jpg" alt="..." /></div>     
            </div>
          </div>
        </section>

        <!-- Footer-->
        <footer class="footer bg-black small text-center text-white-50"><div class="container px-4 px-lg-5">Copyright &copy; Your Website 2023</div></footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="assets/bootstrap/js/scripts.js"></script>
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        <!-- * *                               SB Forms JS                               * *-->
        <!-- * * Activate your form at https://startbootstrap.com/solution/contact-forms * *-->
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
    </body>
</html>
